<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Qiuse Model Roles</title><style>body{font:14px system-ui;padding:24px;color:#202124}h1{margin:0 0 16px}.panel{border:1px solid #ddd;border-radius:8px;padding:16px;max-width:720px;margin-bottom:16px}label{display:block;margin:10px 0 4px}input{padding:8px;width:100%;box-sizing:border-box}button{padding:8px 14px;margin-top:12px}#msg{margin-left:10px;color:#176b32}</style></head><body><h1>Qiuse Model Roles</h1><div class="panel"><p>修改模型角色与备用顺序。令牌不会在页面显示。</p><label>主回复模型</label><input id="deepseek"><label>Gemini 辅助模型</label><input id="gemini"><label>GPT 备用模型</label><input id="gpt"><label>上下文压缩 provider</label><input id="compress"><label>备用顺序（逗号分隔）</label><input id="fallback" value="gemini_aux,gpt_backup"><button onclick="save()">保存配置</button><span id="msg"></span></div><script>const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/astrbot_plugin_qiuse_model_roles/page/config');const d=await r.json();$('deepseek').value=d.providers.deepseek_main||'';$('gemini').value=d.providers.gemini_aux||'';$('gpt').value=d.providers.gpt_backup||'';$('compress').value=d.compress||'';$('fallback').value=(d.fallback||[]).join(',')}async function save(){const r=await fetch('/api/astrbot_plugin_qiuse_model_roles/page/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deepseek_main:$('deepseek').value,gemini_aux:$('gemini').value,gpt_backup:$('gpt').value,compress:$('compress').value,fallback:$('fallback').value.split(',').map(x=>x.trim())})});$('msg').textContent=r.ok?'已保存':'保存失败'}load()</script></body></html>
