[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxxixi"
version = "2.2.5"
description = "微信智能聊天机器人分支：接入 DeepSeek 等 OpenAI 兼容大模型，支持记忆、情绪表情包、定时任务、联网搜索、WebUI 配置与微信 4.1.x 兼容补丁；底层使用 wechatauto-replica"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["wechat", "weixin", "wechat-bot", "chatbot", "ai", "llm", "deepseek", "kourichat", "automation", "wechatauto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "wechatauto-replica[guia]>=1.2.0",
    "flask",
    "werkzeug",
    "openai==1.84.0",
    "psutil",
    "filelock",
    "requests",
    "beautifulsoup4",
    "lxml",
]

[project.urls]
Homepage = "https://github.com/waxx1573/wxxixi"
Source = "https://github.com/waxx1573/wxxixi"
Issues = "https://github.com/waxx1573/wxxixi/issues"

[project.scripts]
wechatbot = "bot:main"
wechatbot-webui = "config_editor:main"

[tool.setuptools]
py-modules = ["bot", "config", "config_editor", "wxbot"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["emojis*", "prompts*", "templates*"]

[tool.setuptools.package-data]
"*" = ["*", "*/*", "*/*/*", "*/*/*/*"]
